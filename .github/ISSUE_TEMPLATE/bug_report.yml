name: Developer alpha bug
description: Report setup, processing, playback or cleanup failures without private media.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach raw reports, logs, credentials, captions or source videos. Review diagnostic-summary.json before sharing. Security vulnerabilities must be reported privately."
  - type: input
    id: version
    attributes:
      label: Commit or source version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected versus actual behavior
      description: "Use non-private filenames and describe the failed stage."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and reviewed diagnostic summary
      description: "Windows/Python version, RAM/GPU, requested versus actual paths; attach only a reviewed diagnostic summary."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue review
      options:
        - label: "I reviewed attachments and removed secrets and private or unauthorized media/text."
          required: true