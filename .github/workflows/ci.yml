name: Windows developer alpha checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Setup without model downloads
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Full backend suite
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m pytest backend/tests -q
      - name: Generate synthetic fixture
        shell: pwsh
        run: ./scripts/test-fixture.ps1
      - name: Browser smoke tests
        shell: pwsh
        env:
          CLIPPER_TEST_START_SERVER: '1'
        run: |
          $node = '.tools/node-v24.22.2-win-x64/node.exe'
          & $node apps/web/node_modules/@playwright/test/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed.' }
          & $node apps/web/node_modules/@playwright/test/cli.js test --config apps/web/playwright.config.ts --grep 'local workbench|flagged transcript|without speech models'
          if ($LASTEXITCODE -ne 0) { throw 'Browser checks failed.' }